name: App into the server
description: >-
  The checkout copied into nextcloud/apps/large_file_previews and enabled,
  optionally with its development dependencies (for PHPUnit).

inputs:
  dev-dependencies:
    description: Install the Composer dependencies with dev and PHPUnit's bin (true or false)
    default: 'false'

runs:
  using: composite
  steps:
    - name: Copy the app into the server
      shell: bash
      run: |
        mkdir -p nextcloud/apps/large_file_previews
        rsync -a --exclude='.git' --exclude='nextcloud' ./ nextcloud/apps/large_file_previews/

    - name: Install Composer dependencies
      if: inputs.dev-dependencies == 'true'
      shell: bash
      working-directory: nextcloud/apps/large_file_previews
      run: |
        composer install --no-interaction --no-scripts
        composer bin phpunit install --no-interaction

    - name: Enable the app
      shell: bash
      working-directory: nextcloud
      run: php occ app:enable large_file_previews
