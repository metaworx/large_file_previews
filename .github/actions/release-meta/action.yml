name: Release metadata
description: >-
  The tag this run was started for, the app id and version appinfo/info.xml
  states, and the kind of release the tag makes; fails when the tag does not
  name the manifest's version, or when its commit is not on master. Needs the
  tag's tree checked out.

outputs:
  tag:
    description: The tag, e.g. v0.20.3 or v0.20.3-rc1
    value: ${{ steps.meta.outputs.tag }}
  app-id:
    description: The app id from appinfo/info.xml, which names the tarballs
    value: ${{ steps.meta.outputs.app-id }}
  version:
    description: The version from appinfo/info.xml, e.g. 0.20.3
    value: ${{ steps.meta.outputs.version }}
  kind:
    description: nightly, stable, or skip for a tag that publishes nothing
    value: ${{ steps.meta.outputs.kind }}

runs:
  using: composite
  steps:
    - name: Read the release's tag, version and kind
      id: meta
      shell: bash
      run: |
        tag="${GITHUB_REF_NAME}"
        app_id="$(sed -n 's|.*<id>\([^<]*\)</id>.*|\1|p' appinfo/info.xml | head -n1 | tr -d '[:space:]')"
        version="$(sed -n 's|.*<version>\([^<]*\)</version>.*|\1|p' appinfo/info.xml | head -n1 | tr -d '[:space:]')"
        if [ -z "$app_id" ]; then
          echo "::error::appinfo/info.xml names no <id>."
          exit 1
        fi
        if [ "v${version}" != "${tag%%-*}" ]; then
          echo "::error::The manifest says ${version} and the tag says ${tag}."
          exit 1
        fi
        # Releases come from master: a version tag set on another branch
        # runs the tests and publishes nothing.
        git fetch --quiet --no-tags --unshallow origin master 2>/dev/null \
          || git fetch --quiet --no-tags origin master
        if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
          echo "::error::${tag} points at ${GITHUB_SHA}, which is not on master."
          exit 1
        fi
        # 0.x is pre-release by definition (see CHANGELOG.md) — never stable,
        # with or without a -suffix; this branch must stay ahead of the
        # strict one below, which would otherwise claim plain v0.Y.Z.
        if [[ "$tag" =~ ^v0\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
          kind=nightly
        elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          kind=stable
        elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+$ ]]; then
          kind=nightly
        else
          kind=skip
        fi
        echo "release ${tag}: ${app_id} ${version}, ${kind}"
        {
          echo "tag=${tag}"
          echo "app-id=${app_id}"
          echo "version=${version}"
          echo "kind=${kind}"
        } >> "$GITHUB_OUTPUT"
